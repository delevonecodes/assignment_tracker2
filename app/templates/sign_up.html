{% extends "index.html" %} 
{% block title %}Sign Up{% endblock %}

{% block content %}
    <h1>Sign Up Page</h1>
    <p>Welcome to the Sign Up Page!</p>
    <form method ="POST">
        <h3 allign="center">Sign Up</h3>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@example.com" required><br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="username"required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="password" required><br><br>
        <label for="confirm password">Password (Confirm):</label>
        <input type="password" id="confirm_password" name="password2" placeholder="confirm password" required><br><br>
        <input type="submit" value="Sign Up">
    </form>
{% endblock %}
