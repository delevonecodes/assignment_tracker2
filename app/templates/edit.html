{% extends "index.html" %}

{% block title %}Edit Note{% endblock %}

{% block content %}
    <div align="center">
        <h1>Edit Note</h1>
        <form method="POST" action="/edit-note/{{ note.id }}">
            <textarea name="note" id="note">{{ note.data }}</textarea>
            <div align="center">
                <input type="submit" value="Update Note">
            </div>
        </form>
    </div>
{% endblock %}
