{% extends "index.html" %}

{% block title %}Edit Note{% endblock %}

{% block content %}
    <div align="center">
        <h1>Edit Assignment</h1>
        <form method="POST" action="/edit-assignment/{{ assignment.id }}">
            <textarea name="assignment" id="assignment">{{ assignment.data }}</textarea>
            <div align="center">
                <input type="submit" value="Update Assignment">
            </div>
        </form>
    </div>
{% endblock %}
